name: release

# Builds the desktop app for each supported platform and the Android APK, and
# attaches them to a GitHub release. Pushing a tag such as `v0.1.0` publishes the release.
# Running the workflow by hand builds the same archives and leaves them as
# workflow artifacts, which is the way to check a build before tagging.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          # Intel macOS cross-builds on the Apple Silicon runner: the macos-13
          # Intel runner is retired and its jobs never pick up a machine.
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7

      # winit, cpal and gilrs link X11, ALSA and udev on Linux. The launcher
      # needs nothing more to build: eframe loads OpenGL, X11 and Wayland at
      # run time, and rfd opens its file picker through the XDG portal, so it
      # has no GTK dependency. Players need an xdg-desktop-portal service for
      # the Browse buttons.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        env:
          GAME_DEPS: >-
            pkg-config libasound2-dev libudev-dev libx11-dev
            libxkbcommon-dev libwayland-dev
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $GAME_DEPS

      - name: Install the Rust target
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p z2-native -p z2-launcher -p z2-signal

      # Every archive holds the game, the launcher, the signalling server used
      # for online co-op, and the documents a first run needs. No ROM, ever.
      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          name="z2rs-${GITHUB_REF_NAME#v}-${{ matrix.target }}"
          [ "$GITHUB_REF_TYPE" = tag ] || name="z2rs-${{ matrix.target }}"
          bin="target/${{ matrix.target }}/release"
          mkdir "$name"
          cp "$bin/z2-native" "$name/z2rs"
          cp "$bin/z2-launcher" "$name/z2rs-launcher"
          cp "$bin/z2-signal" "$name/z2-signal"
          chmod +x "$name/z2rs" "$name/z2rs-launcher" "$name/z2-signal"
          cp README.md LICENSE LEGAL.md packaging/HOW-TO-PLAY.txt "$name/"
          tar czf "$name.tar.gz" "$name"
          echo "ARCHIVE=$name.tar.gz" >> "$GITHUB_ENV"

      # macOS gets a z2rs.app bundle with the launcher as its main executable
      # and the game and signalling server beside it in Contents/MacOS, where
      # the launcher looks for them. The bare `z2rs` binary also sits in the
      # archive root for anyone who runs it from a terminal. The archive is a
      # zip made by ditto, which keeps the bundle's permissions, symlinks and
      # extended attributes intact; Finder unpacks it with a double click.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || version="0.0.0"
          name="z2rs-$version-${{ matrix.target }}"
          [ "$GITHUB_REF_TYPE" = tag ] || name="z2rs-${{ matrix.target }}"
          bin="target/${{ matrix.target }}/release"
          app="$name/z2rs.app"
          mkdir -p "$app/Contents/MacOS"
          cp "$bin/z2-launcher" "$app/Contents/MacOS/z2rs-launcher"
          cp "$bin/z2-native" "$app/Contents/MacOS/z2rs"
          cp "$bin/z2-signal" "$app/Contents/MacOS/z2-signal"
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>z2rs-launcher</string>
            <key>CFBundleIdentifier</key><string>com.z2rs.launcher</string>
            <key>CFBundleName</key><string>z2rs</string>
            <key>CFBundleDisplayName</key><string>z2rs</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleShortVersionString</key><string>$version</string>
            <key>CFBundleVersion</key><string>$version</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$app/Contents/Info.plist"
          # An ad-hoc signature does not satisfy Gatekeeper, but without any
          # signature Apple Silicon reports a downloaded app as damaged.
          codesign --force --deep -s - "$app"
          codesign --verify --deep --strict "$app"
          cp "$bin/z2-native" "$name/z2rs"
          cp README.md LICENSE LEGAL.md packaging/HOW-TO-PLAY.txt "$name/"
          ditto -c -k --keepParent "$name" "$name.zip"
          echo "ARCHIVE=$name.zip" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          name="z2rs-${GITHUB_REF_NAME#v}-${{ matrix.target }}"
          [ "$GITHUB_REF_TYPE" = tag ] || name="z2rs-${{ matrix.target }}"
          bin="target/${{ matrix.target }}/release"
          mkdir "$name"
          cp "$bin/z2-native.exe" "$name/z2rs.exe"
          cp "$bin/z2-launcher.exe" "$name/z2rs-launcher.exe"
          cp "$bin/z2-signal.exe" "$name/z2-signal.exe"
          cp README.md LICENSE LEGAL.md packaging/HOW-TO-PLAY.txt "$name/"
          7z a "$name.zip" "$name" > /dev/null
          echo "ARCHIVE=$name.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  # The Android app: the Rust library for arm64-v8a and x86_64 (cargo-ndk),
  # then the release APK from the Gradle project in android/. The runner image
  # already has the Android SDK and JDK 17; the NDK, platform and build tools
  # are pinned here. Tag builds are signed with the release key from the
  # repository secrets, so every release installs over the previous one. A
  # manual run without the secrets leaves an unsigned APK as the artifact.
  android:
    name: android
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v7

      - name: Install the Android NDK, platform and build tools
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;$NDK_VERSION" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install the Rust targets and cargo-ndk
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - name: Build
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || version="0.0.0"
          Z2RS_VERSION="$version" tools/android/build.sh --apk release

      - name: Sign
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          name="z2rs-${GITHUB_REF_NAME#v}-android"
          [ "$GITHUB_REF_TYPE" = tag ] || name="z2rs-android"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          unsigned=android/app/build/outputs/apk/release/app-release-unsigned.apk
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              echo "The release key secrets are not set; a tagged release needs a signed APK." >&2
              exit 1
            fi
            cp "$unsigned" "$name-unsigned.apk"
            echo "ARCHIVE=$name-unsigned.apk" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          "$tools/zipalign" -P 16 -f 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" \
            --out "$name.apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --print-certs "$name.apk"
          rm -f "$RUNNER_TEMP/release.jks"
          echo "ARCHIVE=$name.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  release:
    name: publish
    needs: [build, android]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip *.apk > SHA256SUMS
          cat SHA256SUMS

      # The binaries are unsigned, so the release notes say what each system
      # does about that before it will run them.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          Desktop and Android builds of z2rs. Download the archive for your system and unpack
          it. Double-click `z2rs-launcher` (`z2rs.app` on macOS), pick your ROM,
          and press Play. The game remembers the ROM, so later you can also start
          `z2rs` directly. `HOW-TO-PLAY.txt` in the archive lists the controls and
          where settings and saves are kept.

          No ROM is included and none is uploaded anywhere. You need your own
          Zelda II (USA) `.nes` file.

          From a terminal, run the game directly:

              ./z2rs --rom /path/to/zelda2.nes [--scale 3] [--fullscreen]

          `./z2rs --help` lists every flag. `z2-signal` is the signalling server
          for online co-op, and you only need it if you host your own instead of
          using the public one the launcher points at.

          These builds are not code signed, so each system warns the first time:

          - macOS: right-click `z2rs.app` and choose Open. On newer macOS, if
            that does not offer Open, try once, then go to System Settings >
            Privacy & Security and click Open Anyway. If macOS still refuses, run
            `xattr -dr com.apple.quarantine z2rs.app` in the unpacked folder.
          - Windows: SmartScreen shows "Windows protected your PC". Click More
            info, then Run anyway.
          - Linux: if the files do not start, run
            `chmod +x z2rs z2rs-launcher z2-signal`.

          On Android 8.0 or newer, download `z2rs-VERSION-android.apk` on the
          phone and open it. Android asks once to allow installs from your
          browser or file manager. Open z2rs, pick your ROM and press Play. An
          on-screen gamepad is shown until you connect a controller.
          `guide/android.md` has the details.

          `SHA256SUMS` lists the checksum of every archive and the APK.
          EOF
          sed -i "s/VERSION/${GITHUB_REF_NAME#v}/" notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "z2rs $GITHUB_REF_NAME" \
            --notes-file notes.md \
            dist/*
