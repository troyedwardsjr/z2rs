[package]
name = "z2-render"
version = "0.1.0"
edition = "2021"
description = "z2rs display layer: HD graphics packs (pack.json + PNG sheets), template sheets, recorder (wasm32-clean)"

[lib]
name = "z2_render"
path = "src/lib.rs"

[dependencies]
# PNG codec for HD-pack sheets and template dumps. MIT OR Apache-2.0, pure Rust
# (#![forbid(unsafe_code)], no C, no getrandom), rust-version 1.73, builds for
# wasm32-unknown-unknown.
png = "0.18.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Master palette, render record (tile/sprite identity) and the widescreen
# indexed renderer the compositor upscales.
z2-ppu = { path = "../z2-ppu" }

[dev-dependencies]
# ROM-gated tests only: real frames come from a `Game`. The library itself
# never depends on z2-core, so the wasm build stays light.
z2-core = { path = "../z2-core" }
