[package]
name = "z2-web"
version = "0.1.0"
edition = "2021"
description = "z2rs web frontend for wasm32-unknown-unknown"
authors = ["troyedwardsjr"]
license = "MIT"

[lib]
name = "z2_web"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
# Default stays EMPTY so `cargo build -p z2-web --target wasm32-unknown-unknown`
# produces the bundle it did before HD packs and netplay existed. Widescreen
# and local co-op need nothing extra: they are pure z2-ppu / z2-core.
default = []
# HD graphics packs: adds z2-render, which pulls the `png` decoder, serde and
# serde_json (pure Rust, wasm32-clean, but not free — hence a feature).
hd = ["dep:z2-render"]
# Lockstep protocol only: `z2-net` with no features has no dependencies, so this
# stays wasm-clean and is testable on the host (the loopback transport).
net = ["dep:z2-net"]
# Online co-op in the browser: adds matchbox's WebRTC data channels, which pull
# web-sys/js-sys/wasm-bindgen-futures. wasm32 needs no C toolchain.
netplay = ["net", "z2-net/matchbox"]

[dependencies]
wasm-bindgen = "0.2"
z2-core = { path = "../z2-core" }
z2-assets = { path = "../z2-assets" }
z2-ppu = { path = "../z2-ppu" }
z2-apu = { path = "../z2-apu" }
z2-net = { path = "../z2-net", optional = true }
z2-render = { path = "../z2-render", optional = true }

[dev-dependencies]
serde_json = "1"
