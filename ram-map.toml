# ram-map.toml — curated Zelda II (NES) CPU-RAM map for code generation.
#
# Ownership: coordinated. Do not edit without coordinating with the maintainer.
# Build input for `crates/z2-core/build.rs`, which generates typed accessors
# (`Ram::link_hp`, `Ram::set_link_hp`, `Ram::enemy(slot).x`, ...) into
# `$OUT_DIR/ram_gen.rs`.
#
# Sources:
#   * Data Crystal, "Zelda II: The Adventure of Link / RAM map"
#     (datacrystal.tcrf.net, page rev. 2025-01-31).
#   * `third_party/z2disassembly/ram-map.txt` — an
#     address-annotated listing (`ADDR ; comment`, hex, `,X`/`,Y` suffixes
#     for indexed tables), plus formal ca65 symbols in
#     `third_party/z2disassembly/src/variables.asm`.
#
# Each block carries `label` (the listing term it cites) and `verified`
# (true once `tests/ram_map.rs` greps that term at that address in the
# listing). Entries still marked `verified = false` are Data Crystal- or
# note-sourced and MUST be confirmed against a future annotated listing.
#
# Schema (strict subset of TOML — the std-only parser in build.rs supports
# exactly this; keep values simple: no `#` or `"` inside strings):
#   [[entry]]  addr=0xNNNN width=1|2 endian="le"|"be"(default "le")
#              name="snake_case" doc="..." label="listing term"
#              source="..." verified=true|false
#   [[array]]  slot_of="enemy"|"projectile"|"none" name="..."
#              base=0xNNNN count=N width=1 doc="..." label="..." source="..."
#              verified=true|false
#   * `slot_of="enemy"|"projectile"` arrays must be named `<slot>_<field>`
#     (e.g. `enemy_hp`) and share one `count` per slot kind (6).
#   * `slot_of="none"` arrays generate indexed `name(i)` / `set_name(i, v)`.
#   * Addresses are NES CPU-RAM ($0000-$07FF). No two blocks may overlap
#     (build.rs rejects overlaps).

# ---------------------------------------------------------------- frame/link

[[entry]]
addr = 0x0012
width = 1
name = "frame_counter"
doc = "Frame counter, incremented by the NMI handler every vblank. Headless timers key off this."
label = "Frame Counter"
source = "Data Crystal ($0012) + listing (12 Frame Counter, ascending)"
verified = true

[[entry]]
addr = 0x0029
width = 1
name = "link_y"
doc = "Link Y position, side view."
label = "Link's Y Position"
source = "Data Crystal ($0029) + listing (29 Link Y)"
verified = true

[[entry]]
addr = 0x003B
width = 1
name = "link_page"
doc = "Link current map page, side view (Data Crystal); the listing reads the same byte as the X-position high byte ($004D low)."
label = "link Pagepos"
source = "Data Crystal ($003B map page) + listing (3B link Pagepos / X high)"
verified = true

[[entry]]
