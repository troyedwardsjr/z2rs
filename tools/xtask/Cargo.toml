[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
description = "z2rs developer task runner with ledger subcommands"
authors = ["troyedwardsjr"]
license = "MIT"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
